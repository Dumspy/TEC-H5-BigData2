[project]
name = "iris-etl-hdfs"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "hdfs>=2.7.3",
    "pyspark>=4.0.0",
    "requests>=2.32.0",
]

[tool.basedpyright]
# The JVM bridge (spark._jvm / Py4J) is inherently dynamic; stick to the
# standard checks instead of basedpyright's strict "all" mode.
typeCheckingMode = "standard"
